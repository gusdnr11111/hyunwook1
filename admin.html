<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DEV BOT 관리자 대시보드</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<script src="https://cdn.tailwindcss.com"></script>
<style>
  body { background: #0b0f19; color: #f8fafc; font-family: 'Inter', 'Noto Sans KR', sans-serif; }
</style>
</head>
<body class="min-h-screen flex flex-col">

<!-- LOGIN MODAL (초기 진입 시) -->
<div id="loginModal" class="fixed inset-0 z-50 flex items-center justify-center bg-black/80 backdrop-blur-md p-4">
  <div class="bg-[#151c2c] border border-slate-700 rounded-2xl max-w-sm w-full p-6 shadow-2xl">
    <div class="text-center mb-6">
      <div class="w-12 h-12 rounded-xl bg-indigo-600 flex items-center justify-center mx-auto mb-3 text-white text-xl">
        <i class="fa-solid fa-lock"></i>
      </div>
      <h2 class="text-lg font-bold text-white">관리자 인증</h2>
      <p class="text-xs text-slate-400 mt-1">아이디와 비밀번호를 입력하세요.</p>
    </div>

    <form onsubmit="handleLogin(event)" class="space-y-4">
      <div>
        <label class="block text-xs font-semibold text-slate-300 mb-1">아이디</label>
        <input type="text" id="adminId" required placeholder="아이디" class="w-full bg-[#0b0f19] border border-slate-700 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-indigo-500">
      </div>
      <div>
        <label class="block text-xs font-semibold text-slate-300 mb-1">비밀번호</label>
        <input type="password" id="adminPw" required placeholder="비밀번호" class="w-full bg-[#0b0f19] border border-slate-700 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-indigo-500">
      </div>
      <button type="submit" class="w-full py-2.5 rounded-lg bg-indigo-600 hover:bg-indigo-500 text-white font-bold text-sm transition-all">
        대시보드 로그인
      </button>
    </form>
  </div>
</div>

<!-- DASHBOARD (로그인 완료 시) -->
<div id="dashboardArea" class="hidden flex-1 flex flex-col">
  <header class="border-b border-slate-800 bg-[#151c2c] px-6 py-4 flex items-center justify-between sticky top-0 z-40">
    <div class="flex items-center gap-3">
      <span class="px-2.5 py-1 rounded bg-indigo-500/20 text-indigo-400 text-xs font-bold">DEV BOT ADMIN</span>
      <h1 class="text-base font-bold text-white">문의 관리 및 유저 DM 발송</h1>
    </div>
    <div class="flex items-center gap-4">
      <span class="text-xs text-slate-400"><i class="fa-solid fa-user-shield text-emerald-400 mr-1"></i> gusdnr0216</span>
      <button onclick="adminLogout()" class="text-xs text-red-400 border border-slate-700 hover:bg-red-500/10 rounded-lg px-3 py-1.5 transition-all">
        로그아웃
      </button>
    </div>
  </header>

  <main class="max-w-6xl mx-auto w-full px-4 py-8 space-y-6">
    <!-- 통계 카드 -->
    <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
      <div class="bg-[#151c2c] border border-slate-800 rounded-xl p-5">
        <div class="text-xs text-slate-400">누적 사이트 방문/조회수</div>
        <div id="statVisits" class="text-2xl font-extrabold text-white mt-1">0회</div>
      </div>
      <div class="bg-[#151c2c] border border-slate-800 rounded-xl p-5">
        <div class="text-xs text-slate-400">문의 신청 유저 수</div>
        <div id="statUsers" class="text-2xl font-extrabold text-emerald-400 mt-1">0명</div>
      </div>
      <div class="bg-[#151c2c] border border-slate-800 rounded-xl p-5">
        <div class="text-xs text-slate-400">총 접수된 문의 건수</div>
        <div id="statInquiries" class="text-2xl font-extrabold text-blue-400 mt-1">0건</div>
      </div>
    </div>

    <!-- 문의 내역 및 실시간 DM 답장 -->
    <div class="bg-[#151c2c] border border-slate-800 rounded-2xl p-6">
      <div class="flex items-center justify-between mb-6">
        <div>
          <h2 class="text-base font-bold text-white">접수된 문의 내역 (D1 DB 연동)</h2>
          <p class="text-xs text-slate-400 mt-0.5">답장을 작성하고 [DM 답장 전송]을 누르면 봇이 해당 유저의 디스코드 DM으로 즉시 전달합니다.</p>
        </div>
        <button onclick="loadData()" class="px-3 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-xs text-slate-300 flex items-center gap-1.5">
          <i class="fa-solid fa-rotate-right"></i> 새로고침
        </button>
      </div>

      <div id="inquiryList" class="space-y-4">
        <div class="text-center py-8 text-slate-500 text-xs">데이터를 불러오는 중입니다...</div>
      </div>
    </div>
  </main>
</div>

<script>
function handleLogin(e) {
  e.preventDefault();
  const id = document.getElementById('adminId').value.trim();
  const pw = document.getElementById('adminPw').value.trim();

  if (id === 'gusdnr0216' && pw === 'gusdnr0216!') {
    sessionStorage.setItem('admin_logged', 'true');
    document.getElementById('loginModal').classList.add('hidden');
    document.getElementById('dashboardArea').classList.remove('hidden');
    loadData();
  } else {
    alert('아이디 또는 비밀번호가 일치하지 않습니다.');
  }
}

document.addEventListener('DOMContentLoaded', () => {
  if (sessionStorage.getItem('admin_logged') === 'true') {
    document.getElementById('loginModal').classList.add('hidden');
    document.getElementById('dashboardArea').classList.remove('hidden');
    loadData();
  }
});

function adminLogout() {
  sessionStorage.removeItem('admin_logged');
  location.reload();
}

async function loadData() {
  const container = document.getElementById('inquiryList');
  try {
    const res = await fetch('/api/admin?action=stats');
    const data = await res.json();

    document.getElementById('statVisits').textContent = `${data.totalVisits || 0}회`;
    document.getElementById('statUsers').textContent = `${data.loggedUsers || 0}명`;
    document.getElementById('statInquiries').textContent = `${(data.inquiries || []).length}건`;

    const list = data.inquiries || [];
    if (list.length === 0) {
      container.innerHTML = `<div class="text-center py-10 text-slate-500 text-xs">접수된 문의가 아직 없습니다.</div>`;
      return;
    }

    container.innerHTML = list.map(item => `
      <div class="bg-[#0b0f19] border border-slate-800 rounded-xl p-5 space-y-3">
        <div class="flex items-center justify-between text-xs border-b border-slate-800/80 pb-2.5">
          <div class="flex items-center gap-2">
            <span class="px-2 py-0.5 rounded bg-indigo-500/20 text-indigo-400 font-bold">${item.category}</span>
            <span class="font-bold text-white text-sm">${item.global_name || item.username}</span>
            <span class="text-slate-500 font-mono">(@${item.username} / ID: ${item.user_id})</span>
          </div>
          <span class="text-slate-500">${item.created_at || ''}</span>
        </div>

        <div class="text-sm text-slate-200 whitespace-pre-wrap leading-relaxed">${item.content}</div>

        <div class="text-xs text-slate-400 bg-slate-900/60 p-2.5 rounded-lg flex items-center justify-between">
          <span><strong>희망 예산:</strong> ${item.budget || '미정/협의'}</span>
          <span class="${item.status === '답변완료' ? 'text-emerald-400 font-bold' : 'text-amber-400 font-bold'}">
            <i class="fa-solid fa-circle text-[8px] mr-1"></i> ${item.status || '대기중'}
          </span>
        </div>

        <!-- DM 답장 입력란 -->
        <div class="flex gap-2 pt-2 border-t border-slate-800">
          <input type="text" id="reply_${item.id}" placeholder="유저 디스코드 DM으로 전달할 답변 입력..." class="flex-1 bg-[#151c2c] border border-slate-700 rounded-lg px-3.5 py-2 text-xs text-white focus:outline-none focus:border-indigo-500">
          <button onclick="sendReply('${item.id}', '${item.user_id}', '${item.global_name || item.username}')" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-500 text-white rounded-lg text-xs font-bold transition-all">
            DM 답장 전송
          </button>
        </div>
      </div>
    `).join('');
  } catch (e) {
    container.innerHTML = `<div class="text-center py-8 text-red-400 text-xs">데이터 로드 실패</div>`;
  }
}

async function sendReply(inquiryId, userId, userName) {
  const input = document.getElementById(`reply_${inquiryId}`);
  const reply = input.value.trim();
  if (!reply) return alert('답변 내용을 입력해 주세요.');

  if (!confirm(`${userName}님에게 디스코드 DM으로 답변을 전송하시겠습니까?`)) return;

  try {
    const res = await fetch('/api/admin?action=reply', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ inquiryId, userId, reply })
    });
    const data = await res.json();
    if (res.ok && data.success) {
      alert('✅ 유저 디스코드 DM으로 답변이 정상 발송되었습니다!');
      input.value = '';
      loadData();
    } else {
      alert('❌ 발송 실패: ' + (data.error || '알 수 없는 오류'));
    }
  } catch (e) {
    alert('서버 통신 오류');
  }
}
</script>
</body>
</html>
