<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>어드민 패널 | DEV BOT</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Noto+Sans+KR:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
* { margin:0; padding:0; box-sizing:border-box; font-family:'Inter','Noto Sans KR',sans-serif; }
body { background:#0b0f19; color:#fff; min-height:100vh; padding:2rem; }
.container { max-width:1000px; margin:0 auto; }
h1 { font-size:1.8rem; margin-bottom:2rem; color:#5865F2; display:flex; align-items:center; gap:10px; }
.login-box { max-width:400px; margin:5rem auto; padding:2rem; background:#151c2c; border:1px solid #2d3748; border-radius:16px; }
.login-box h2 { margin-bottom:1.5rem; text-align:center; }
.login-box input { width:100%; padding:.9rem 1rem; background:#0b0f19; border:1px solid #2d3748; border-radius:8px; color:#fff; margin-bottom:1rem; font-size:1rem; }
.login-box button { width:100%; padding:.9rem; background:#5865F2; color:#fff; border:none; border-radius:8px; font-weight:600; cursor:pointer; font-size:1rem; }
.login-box button:hover { background:#4752C4; }
.inquiry-card { background:#151c2c; border:1px solid #2d3748; border-radius:12px; padding:1.5rem; margin-bottom:1rem; }
.inquiry-card.replied { border-color:#48bb78; }
.inquiry-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:1rem; }
.inquiry-header .user { display:flex; align-items:center; gap:.8rem; }
.inquiry-header img { width:40px; height:40px; border-radius:50%; }
.inquiry-header .name { font-weight:600; }
.inquiry-header .id { color:#a0aec0; font-size:.8rem; }
.badge { padding:.3rem .8rem; border-radius:20px; font-size:.75rem; font-weight:600; }
.badge.pending { background:rgba(246,173,85,.15); color:#f6ad55; }
.badge.replied { background:rgba(72,187,120,.15); color:#48bb78; }
.content { background:#0b0f19; padding:1rem; border-radius:8px; margin-bottom:1rem; color:#cbd5e0; white-space:pre-wrap; }
.reply-box textarea { width:100%; padding:.8rem; background:#0b0f19; border:1px solid #2d3748; border-radius:8px; color:#fff; font-family:inherit; resize:vertical; min-height:80px; margin-bottom:.8rem; }
.reply-box button { padding:.7rem 1.5rem; background:#00d4ff; color:#0b0f19; border:none; border-radius:8px; font-weight:600; cursor:pointer; }
.reply-box button:hover { background:#00b8e0; }
.timestamp { color:#718096; font-size:.8rem; margin-top:.5rem; }
.top-bar { display:flex; justify-content:space-between; align-items:center; margin-bottom:2rem; }
.logout-btn { padding:.5rem 1rem; background:transparent; color:#fc8181; border:1px solid #fc8181; border-radius:8px; cursor:pointer; font-size:.9rem; }
.logout-btn:hover { background:rgba(252,129,129,.1); }
.empty { text-align:center; color:#a0aec0; padding:3rem; }
</style>
</head>
<body>

<div class="container">
  <div id="loginView" class="login-box">
    <h2><i class="fa-solid fa-lock"></i> 어드민 로그인</h2>
    <input type="password" id="adminPw" placeholder="비밀번호" onkeypress="if(event.key==='Enter')login()">
    <button onclick="login()">로그인</button>
    <div id="loginError" style="color:#fc8181;text-align:center;margin-top:1rem;font-size:.9rem;"></div>
  </div>

  <div id="panelView" style="display:none;">
    <div class="top-bar">
      <h1><i class="fa-solid fa-inbox"></i> 문의 관리</h1>
      <button class="logout-btn" onclick="logout()"><i class="fa-solid fa-right-from-bracket"></i> 로그아웃</button>
    </div>
    <div id="inquiryList"></div>
  </div>
</div>

<script>
async function login() {
  const password = document.getElementById('adminPw').value;
  const res = await fetch('/api/admin/login', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    credentials: 'include',
    body: JSON.stringify({ password })
  });
  if (res.ok) {
    showPanel();
  } else {
    document.getElementById('loginError').textContent = '비밀번호가 올바르지 않습니다.';
  }
}

function logout() {
  location.href = '/api/admin/logout';
}

async function showPanel() {
  document.getElementById('loginView').style.display = 'none';
  document.getElementById('panelView').style.display = 'block';
  loadInquiries();
}

async function loadInquiries() {
  const res = await fetch('/api/admin/inquiries', { credentials: 'include' });
  if (!res.ok) { location.reload(); return; }
  const { inquiries } = await res.json();
  const list = document.getElementById('inquiryList');

  if (!inquiries.length) {
    list.innerHTML = '<div class="empty">아직 문의가 없습니다.</div>';
    return;
  }

  list.innerHTML = inquiries.map(q => `
    <div class="inquiry-card ${q.status === 'replied' ? 'replied' : ''}">
      <div class="inquiry-header">
        <div class="user">
          <img src="${q.avatar ? `https://cdn.discordapp.com/avatars/${q.user_id}/${q.avatar}.png` : 'https://cdn.discordapp.com/embed/avatars/0.png'}">
          <div>
            <div class="name">${q.global_name || q.username}</div>
            <div class="id">@${q.username} · ID #${q.id}</div>
          </div>
        </div>
        <span class="badge ${q.status}">${q.status === 'pending' ? '대기중' : '답변완료'}</span>
      </div>
      <div class="content">${escapeHtml(q.content)}</div>
      ${q.reply ? `<div class="content" style="border-left:3px solid #48bb78;">📬 답변: ${escapeHtml(q.reply)}</div>` : ''}
      ${q.status === 'pending' ? `
        <div class="reply-box">
          <textarea id="reply-${q.id}" placeholder="답변 내용을 입력하세요 (디스코드 DM으로 전송됩니다)"></textarea>
          <button onclick="sendReply(${q.id})"><i class="fa-solid fa-paper-plane"></i> 답변 전송</button>
        </div>
      ` : ''}
      <div class="timestamp">${new Date(q.created_at).toLocaleString('ko-KR')}</div>
    </div>
  `).join('');
}

async function sendReply(id) {
  const reply = document.getElementById(`reply-${id}`).value.trim();
  if (!reply) { alert('답변 내용을 입력하세요.'); return; }
  const res = await fetch('/api/admin/reply', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    credentials: 'include',
    body: JSON.stringify({ id, reply })
  });
  if (res.ok) {
    alert('답변이 전송되었습니다!');
    loadInquiries();
  } else {
    alert('전송 실패');
  }
}

function escapeHtml(str) {
  return str.replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

// 자동 로그인 확인
fetch('/api/admin/inquiries', { credentials: 'include' })
  .then(r => { if (r.ok) showPanel(); })
  .catch(() => {});
</script>

</body>
</html>
