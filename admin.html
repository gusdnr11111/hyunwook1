<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DEV BOT 관리자 대시보드</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<script src="https://cdn.tailwindcss.com"></script>
<style>
  body { background: #070b13; color: #f8fafc; font-family: 'Inter', 'Noto Sans KR', sans-serif; }
</style>
</head>
<body class="min-h-screen flex flex-col">

<!-- DISCORD OAUTH LOGIN MODAL -->
<div id="loginModal" class="fixed inset-0 z-50 flex items-center justify-center bg-black/85 backdrop-blur-md p-4">
  <div class="bg-[#0e1526] border border-slate-800 rounded-2xl max-w-sm w-full p-8 shadow-2xl text-center">
    <div class="w-14 h-14 rounded-2xl bg-indigo-600/20 border border-indigo-500/30 flex items-center justify-center mx-auto mb-4 text-indigo-400 text-2xl">
      <i class="fa-solid fa-shield-halved"></i>
    </div>
    <h2 class="text-xl font-bold text-white mb-1.5">DEV BOT 관리자 인증</h2>
    <p class="text-xs text-slate-400 mb-6">등록된 디스코드 관리자 계정으로 로그인해 주세요.</p>

    <div id="authStatusMessage" class="hidden mb-4 p-3 rounded-xl text-xs border"></div>

    <button onclick="loginWithDiscord()" class="w-full py-3 rounded-xl bg-[#5865F2] hover:bg-[#4752C4] text-white font-bold text-sm flex items-center justify-center gap-2 shadow-lg shadow-indigo-600/20 transition-all cursor-pointer">
      <i class="fa-brands fa-discord text-base"></i>
      <span>디스코드로 관리자 로그인</span>
    </button>
  </div>
</div>

<!-- DASHBOARD -->
<div id="dashboardArea" class="hidden flex-1 flex flex-col">
  <header class="border-b border-slate-800 bg-[#0e1526] px-6 py-4 flex items-center justify-between sticky top-0 z-40">
    <div class="flex items-center gap-3">
      <span class="px-2.5 py-1 rounded bg-indigo-500/20 text-indigo-400 text-xs font-bold">DEV BOT ADMIN</span>
      <h1 class="text-base font-bold text-white">문의 관리 및 유저 DM 발송</h1>
    </div>
    <div class="flex items-center gap-4">
      <span id="adminProfileName" class="text-xs text-slate-300 flex items-center gap-1.5">
        <i class="fa-solid fa-user-check text-emerald-400"></i>
        <span>관리자 인증됨</span>
      </span>
      <button onclick="adminLogout()" class="text-xs text-red-400 border border-slate-700 hover:bg-red-500/10 rounded-lg px-3 py-1.5 transition-all cursor-pointer">
        로그아웃
      </button>
    </div>
  </header>

  <main class="max-w-6xl mx-auto w-full px-4 py-8 space-y-6">
    <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
      <div class="bg-[#0e1526] border border-slate-800 rounded-xl p-5">
        <div class="text-xs text-slate-400">누적 사이트 방문/조회수</div>
        <div id="statVisits" class="text-2xl font-extrabold text-white mt-1">0회</div>
      </div>
      <div class="bg-[#0e1526] border border-slate-800 rounded-xl p-5">
        <div class="text-xs text-slate-400">문의 신청 유저 수</div>
        <div id="statUsers" class="text-2xl font-extrabold text-emerald-400 mt-1">0명</div>
      </div>
      <div class="bg-[#0e1526] border border-slate-800 rounded-xl p-5">
        <div class="text-xs text-slate-400">총 접수된 문의 건수</div>
        <div id="statInquiries" class="text-2xl font-extrabold text-blue-400 mt-1">0건</div>
      </div>
    </div>

    <div class="bg-[#0e1526] border border-slate-800 rounded-2xl p-6">
      <div class="flex items-center justify-between mb-6">
        <div>
          <h2 class="text-base font-bold text-white">접수된 문의 내역 (D1 DB 연동)</h2>
          <p class="text-xs text-slate-400 mt-0.5">답장을 작성하고 [DM 답장 전송]을 누르면 봇이 해당 유저의 디스코드 DM으로 강조 서식(##)을 적용하여 전달합니다.</p>
        </div>
        <button onclick="loadData()" class="px-3 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-xs text-slate-300 flex items-center gap-1.5 cursor-pointer">
          <i class="fa-solid fa-rotate-right"></i> 새로고침
        </button>
      </div>

      <div id="inquiryList" class="space-y-4">
        <div class="text-center py-8 text-slate-500 text-xs">데이터를 불러오는 중입니다...</div>
      </div>
    </div>
  </main>
</div>

<script>
// XSS 및 HTML 인젝션 방어용 문자 치환
function escapeHtml(str) {
  if (!str) return '';
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#039;');
}

function showAuthMsg(msg, isError = true) {
  const box = document.getElementById('authStatusMessage');
  box.className = `mb-4 p-3 rounded-xl text-xs border block ${
    isError ? 'bg-red-500/10 border-red-500/30 text-red-300' : 'bg-emerald-500/10 border-emerald-500/30 text-emerald-300'
  }`;
  box.textContent = msg;
}

// 디스코드 OAuth 로그인 시작 (state=admin 전달)
function loginWithDiscord() {
  window.location.href = '/api/auth/login?state=admin';
}

function adminLogout() {
  sessionStorage.removeItem('admin_jwt_token');
  localStorage.removeItem('devbot_user_session');
  location.replace('/admin');
}

document.addEventListener('DOMContentLoaded', async () => {
  const urlParams = new URLSearchParams(window.location.search);
  const tokenPayload = urlParams.get('tk');

  // 디스코드 콜백에서 유저 정보 토큰을 가지고 /admin으로 돌아온 경우
  if (tokenPayload) {
    try {
      const user = JSON.parse(decodeURIComponent(escape(atob(tokenPayload))));
      window.history.replaceState({}, document.title, window.location.pathname);

      // 서버에 관리자 권한 확인 요청
      const res = await fetch('/api/admin?action=auth', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ user })
      });

      const data = await res.json();
      if (res.ok && data.token) {
        sessionStorage.setItem('admin_jwt_token', data.token);
        sessionStorage.setItem('admin_user_name', user.global_name || user.username);
        openDashboard();
      } else {
        showAuthMsg(data.error || '접근이 거부되었습니다.');
      }
      return;
    } catch (e) {
      showAuthMsg('인증 처리 중 오류가 발생했습니다.');
      return;
    }
  }

  // 이미 세션 토큰이 보관되어 있는 경우 바로 오픈
  if (sessionStorage.getItem('admin_jwt_token')) {
    openDashboard();
  }
});

function openDashboard() {
  document.getElementById('loginModal').classList.add('hidden');
  document.getElementById('dashboardArea').classList.remove('hidden');
  const name = sessionStorage.getItem('admin_user_name');
  if (name) {
    document.getElementById('adminProfileName').innerHTML = `<i class="fa-solid fa-user-check text-emerald-400"></i> <span>${escapeHtml(name)}</span>`;
  }
  loadData();
}

async function loadData() {
  const container = document.getElementById('inquiryList');
  const token = sessionStorage.getItem('admin_jwt_token');

  if (!token) {
    adminLogout();
    return;
  }

  try {
    const res = await fetch('/api/admin?action=stats', {
      headers: { 'Authorization': `Bearer ${token}` }
    });

    if (res.status === 401) {
      alert('관리자 인증 세션이 만료되었습니다.');
      adminLogout();
      return;
    }

    const data = await res.json();
    document.getElementById('statVisits').textContent = `${data.totalVisits || 0}회`;
    document.getElementById('statUsers').textContent = `${data.loggedUsers || 0}명`;
    document.getElementById('statInquiries').textContent = `${(data.inquiries || []).length}건`;

    const list = data.inquiries || [];
    if (list.length === 0) {
      container.innerHTML = `<div class="text-center py-10 text-slate-500 text-xs">접수된 문의가 아직 없습니다.</div>`;
      return;
    }

    // HTML 인젝션(XSS) 방지를 위해 escapeHtml 처리
    container.innerHTML = list.map(item => `
      <div class="bg-[#070b13] border border-slate-800 rounded-xl p-5 space-y-3">
        <div class="flex items-center justify-between text-xs border-b border-slate-800/80 pb-2.5">
          <div class="flex items-center gap-2">
            <span class="px-2 py-0.5 rounded bg-indigo-500/20 text-indigo-400 font-bold">${escapeHtml(item.category)}</span>
            <span class="font-bold text-white text-sm">${escapeHtml(item.global_name || item.username)}</span>
            <span class="text-slate-500 font-mono">(@${escapeHtml(item.username)} / ID: ${escapeHtml(item.user_id)})</span>
          </div>
          <span class="text-slate-500">${escapeHtml(item.created_at || '')}</span>
        </div>

        <div class="text-sm text-slate-200 whitespace-pre-wrap leading-relaxed">${escapeHtml(item.content)}</div>

        <div class="text-xs text-slate-400 bg-slate-900/60 p-2.5 rounded-lg flex items-center justify-between">
          <span><strong>희망 예산:</strong> ${escapeHtml(item.budget || '미정/협의')}</span>
          <span class="${item.status === '답변완료' ? 'text-emerald-400 font-bold' : 'text-amber-400 font-bold'}">
            ● ${escapeHtml(item.status || '대기중')}
          </span>
        </div>

        <div class="flex gap-2 pt-2 border-t border-slate-800">
          <input type="text" id="reply_${item.id}" placeholder="유저 디스코드 DM으로 전달할 답변 입력..." class="flex-1 bg-[#0e1526] border border-slate-700 rounded-lg px-3.5 py-2 text-xs text-white focus:outline-none focus:border-indigo-500">
          <button onclick="sendReply('${item.id}', '${item.user_id}', '${escapeHtml(item.global_name || item.username)}')" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-500 text-white rounded-lg text-xs font-bold transition-all cursor-pointer">
            DM 답장 전송
          </button>
        </div>
      </div>
    `).join('');
  } catch (e) {
    container.innerHTML = `<div class="text-center py-8 text-red-400 text-xs">데이터 로드 실패</div>`;
  }
}

async function sendReply(inquiryId, userId, userName) {
  const input = document.getElementById(`reply_${inquiryId}`);
  const reply = input.value.trim();
  const token = sessionStorage.getItem('admin_jwt_token');

  if (!reply) return alert('답변 내용을 입력해 주세요.');
  if (!confirm(`${userName}님에게 디스코드 DM으로 답변을 전송하시겠습니까?`)) return;

  try {
    const res = await fetch('/api/admin?action=reply', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': `Bearer ${token}`
      },
      body: JSON.stringify({ inquiryId, userId, reply })
    });
    const data = await res.json();
    if (res.ok && data.success) {
      alert('✅ 유저 디스코드 DM으로 답변이 발송되었습니다.');
      input.value = '';
      loadData();
    } else {
      alert('❌ 발송 실패: ' + (data.error || '알 수 없는 오류'));
    }
  } catch (e) {
    alert('통신 오류');
  }
}
</script>
</body>
</html>
